name: Build signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          cache: true

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.p12
          chmod 600 android/upload-keystore.p12
          keytool -importkeystore -noprompt \
            -srckeystore android/upload-keystore.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -destkeystore android/upload-keystore.jks \
            -deststoretype JKS \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEYSTORE_PASSWORD" \
            -destalias "$ANDROID_KEY_ALIAS"
          rm android/upload-keystore.p12
          chmod 600 android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build signed release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Verify release manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          version_line = next(
              line for line in Path("pubspec.yaml").read_text().splitlines()
              if line.startswith("version:")
          )
          version, build = version_line.split(":", 1)[1].strip().split("+", 1)
          manifest = json.loads(Path("deployment/update.json").read_text())
          assert manifest["version"] == version, "Manifest version does not match pubspec.yaml"
          assert manifest["build_number"] == int(build), "Manifest build_number does not match pubspec.yaml"
          PY

      - name: Prepare release APK asset
        run: |
          cp -- build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/followme-latest.apk

      - name: Publish release artifact
        uses: actions/upload-artifact@v4
        with:
          name: followme-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/symbols/
            deployment/update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK release for production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="followme-v1.0.21-24"
          apk="build/app/outputs/flutter-apk/followme-latest.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" deployment/update.json \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" deployment/update.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Followme 1.0.21 (24)" \
              --notes "Signed APK and updater manifest for the Sistem Absensi production deployment."
          fi
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq app-release.apk; then
            gh release delete-asset "$tag" app-release.apk \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
