name: absensi_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.19+22

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  shared_preferences: ^2.2.3
  camera: ^0.11.0
  path_provider: ^2.1.3
  path: ^1.9.0
  geolocator: ^14.0.2
  intl: ^0.19.0
  provider: ^6.1.2
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_image_compress: ^2.0.0
  http: ^1.2.1
  http_parser: ^4.0.2
  mime: ^2.0.0
  google_nav_bar: ^5.0.6
  universal_io: ^2.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^21.0.0
  ota_update: ^7.1.0
  package_info_plus: ^8.3.1
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0
  sentry_flutter: ^8.14.2
  safe_device: ^1.1.1
  crypto: ^3.0.3
  google_mlkit_face_detection: ^0.14.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#40D9C6"
    theme_color: "#40D9C6"
  min_sdk_android: 21
